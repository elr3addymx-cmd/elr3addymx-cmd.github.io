<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El R3ddy – Sitio en Mantenimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Nunito',sans-serif;
    background:#0a0e1f;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }

  /* Fondo animado */
  .bg{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(26,111,196,0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, rgba(204,17,17,0.08) 0%, transparent 55%),
      #0a0e1f;
  }
  .dots{
    position:fixed;inset:0;z-index:0;
    background-image:radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size:32px 32px;
  }

  /* Contenedor principal */
  .container{
    position:relative;z-index:1;
    width:100%;max-width:1000px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  /* Imagen principal */
  .main-img{
    width:100%;
    max-width:900px;
    border-radius:20px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.07),
      0 24px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(26,111,196,0.2);
    animation: fadeIn .8s ease both;
  }

  /* Botón WhatsApp */
  .wa-btn{
    display:inline-flex;
    align-items:center;
    gap:12px;
    background:#25d366;
    color:#fff;
    font-family:'Bangers',cursive;
    font-size:1.2rem;
    letter-spacing:3px;
    padding:16px 32px;
    border-radius:50px;
    text-decoration:none;
    box-shadow:0 8px 32px rgba(37,211,102,0.45);
    animation: fadeIn 1s .3s ease both, waPulse 2.5s 1.3s ease-in-out infinite;
    transition:transform .2s, box-shadow .2s;
  }
  .wa-btn:hover{
    background:#1ebe5d;
    transform:translateY(-3px);
    box-shadow:0 14px 40px rgba(37,211,102,0.6);
  }
  .wa-btn svg{width:28px;height:28px;flex-shrink:0;}

  /* Botón flotante WhatsApp (móvil) */
  .wa-float{
    position:fixed;bottom:24px;right:24px;z-index:9999;
    display:none;
    align-items:center;
    background:#25d366;color:#fff;
    padding:14px;border-radius:50%;
    box-shadow:0 6px 28px rgba(37,211,102,.55);
    text-decoration:none;
    animation:waPulse 2.5s ease-in-out infinite;
    transition:transform .2s;
  }
  .wa-float:hover{transform:scale(1.1);}
  .wa-float svg{width:30px;height:30px;}

  @keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes waPulse{
    0%,100%{box-shadow:0 6px 28px rgba(37,211,102,.45);}
    50%{box-shadow:0 6px 38px rgba(37,211,102,.75),0 0 0 10px rgba(37,211,102,.1);}
  }

  /* Responsive */
  @media(max-width:600px){
    .wa-btn{ display:none; }
    .wa-float{ display:flex; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="dots"></div>

<div class="container">

  <img
